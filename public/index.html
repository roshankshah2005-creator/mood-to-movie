<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood-to-Movie Matcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center p-8">

    <div class="max-w-2xl w-full mt-12">
        <h1 class="text-5xl font-bold text-center mb-4 text-purple-400">🎬 Vibe Matcher</h1>
        <p class="text-center text-gray-400 mb-8">Type a mood. The AI runs directly in your browser.</p>

        <textarea id="moodInput" rows="3" class="w-full bg-gray-800 rounded-lg p-4 text-white focus:ring-2 focus:ring-purple-500 outline-none mb-4 shadow-inner border border-gray-700" placeholder="e.g., A rainy cyberpunk detective story that feels lonely but action-packed..."></textarea>
        
        <button id="searchBtn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-lg">
            Find My Movie
        </button>

        <div id="loading" class="hidden flex flex-col items-center justify-center mt-8 space-y-3 text-gray-400">
            <div class="w-8 h-8 border-4 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-purple-400 font-medium">Finding movies that match your vibe...</p>
        </div>
        
        <div id="resultsList" class="mt-8 space-y-6"></div>
    </div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0/dist/transformers.min.js';
        
        env.allowLocalModels = false;

        let extractor = null;
        const btn = document.getElementById('searchBtn');
        const loading = document.getElementById('loading');
        const resultsDiv = document.getElementById('resultsList');

        btn.addEventListener('click', async () => {
            const mood = document.getElementById('moodInput').value;
            if (!mood.trim()) return alert("Please enter a mood first!");

            btn.disabled = true;
            loading.classList.remove('hidden');
            resultsDiv.innerHTML = '';

            try {
                // 1. Load the AI Model silently in the background (Cached after first use)
                if (!extractor) {
                    extractor = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');
                }

                // 2. Turn the text into a vector
                const output = await extractor(mood, { pooling: 'mean', normalize: true });
                const vectorArray = Array.from(output.data);

                // 3. Send the vector to the Vercel backend for matching
                const response = await fetch('/api/recommend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vector: vectorArray, num_results: 5 })
                });

                if (!response.ok) {
                    throw new Error("Server responded with an error");
                }

                const data = await response.json();
                
                // 4. Render results
                data.results.forEach(movie => {
                    resultsDiv.innerHTML += `
                        <div class="bg-gray-800 p-6 rounded-lg shadow-lg border border-gray-700 hover:border-purple-500 transition-colors duration-300">
                            <h2 class="text-2xl font-bold text-white mb-1">${movie.title}</h2>
                            <p class="text-sm text-purple-400 mb-4 font-semibold">Match Score: ${movie.score}% • ${movie.genres}</p>
                            <p class="text-gray-300 leading-relaxed">${movie.overview}</p>
                        </div>
                    `;
                });
            } catch (err) {
                console.error(err);
                alert("Something went wrong connecting to the server. Please try again.");
            } finally {
                
                btn.disabled = false;
                loading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
