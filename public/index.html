<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood-to-Movie</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center p-8">

    <div class="max-w-2xl w-full mt-12">
        <h1 class="text-5xl font-bold text-center mb-4 text-purple-400">🎬 Vibe Matcher</h1>
        <p class="text-center text-gray-400 mb-8">Type a mood. The AI runs directly in your browser.</p>

        <textarea id="moodInput" rows="3" class="w-full bg-gray-800 rounded-lg p-4 text-white focus:ring-2 focus:ring-purple-500 outline-none mb-4" placeholder="e.g., A rainy cyberpunk detective story..."></textarea>
        
        <button id="searchBtn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-lg transition-colors">
            Find My Movie
        </button>

        <div id="loading" class="hidden text-center text-gray-400 mt-8 space-y-2">
            <div id="statusText" class="font-bold text-purple-400">Initializing AI... (Might take a few seconds on first run)</div>
            <div class="w-full bg-gray-700 rounded-full h-2.5">
                <div id="progressBar" class="bg-purple-600 h-2.5 rounded-full" style="width: 0%"></div>
            </div>
        </div>
        
        <div id="resultsList" class="mt-8 space-y-6"></div>
    </div>

    <!-- Import Transformers.js to run the AI model locally in the browser -->
    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0/dist/transformers.min.js';
        
        // Disable local file checks since we are running in a browser
        env.allowLocalModels = false;

        let extractor = null;
        const btn = document.getElementById('searchBtn');
        const loading = document.getElementById('loading');
        const statusText = document.getElementById('statusText');
        const progressBar = document.getElementById('progressBar');
        const resultsDiv = document.getElementById('resultsList');

        btn.addEventListener('click', async () => {
            const mood = document.getElementById('moodInput').value;
            if (!mood) return alert("Enter a mood!");

            btn.disabled = true;
            loading.classList.remove('hidden');
            resultsDiv.innerHTML = '';

            try {
                // 1. Load the AI Model in the browser (Cached after first use)
                if (!extractor) {
                    statusText.innerText = "Downloading AI Model to your browser...";
                    extractor = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2', {
                        progress_callback: x => {
                            if (x.progress) progressBar.style.width = `${x.progress}%`;
                        }
                    });
                }

                // 2. Turn the text into a vector
                statusText.innerText = "Calculating mood vector...";
                progressBar.style.width = "100%";
                const output = await extractor(mood, { pooling: 'mean', normalize: true });
                
                // Convert the Float32Array to a standard JavaScript Array
                const vectorArray = Array.from(output.data);

                // 3. Send the vector to the Vercel backend for matching
                statusText.innerText = "Searching 100,000 movies...";
                const response = await fetch('/api/recommend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vector: vectorArray, num_results: 5 })
                });

                const data = await response.json();
                
                // 4. Render results
                data.results.forEach(movie => {
                    resultsDiv.innerHTML += `
                        <div class="bg-gray-800 p-6 rounded-lg shadow-lg border border-gray-700">
                            <h2 class="text-2xl font-bold text-white">${movie.title}</h2>
                            <p class="text-sm text-purple-400 mb-4">Match Score: ${movie.score}% • ${movie.genres}</p>
                            <p class="text-gray-300 leading-relaxed">${movie.overview}</p>
                        </div>
                    `;
                });
            } catch (err) {
                console.error(err);
                alert("Something went wrong! Check the console.");
            } finally {
                btn.disabled = false;
                loading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
