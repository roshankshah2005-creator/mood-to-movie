<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibe Matcher — find a film that fits the feeling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12141C;
    --ink-raised:#191C26;
    --gold:#E8A33D;
    --velvet:#C1443B;
    --paper:#F1ECE0;
    --slate:#8B93A8;
    --hairline:#2A2D3A;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--ink);
    color:#EDEBE4;
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }

  /* --- film strip header, the one bold moment --- */
  .filmstrip{
    height:22px;
    width:100%;
    background:
      repeating-linear-gradient(
        90deg,
        transparent 0 10px,
        var(--ink-raised) 10px 30px
      );
    position:relative;
    border-bottom:1px solid var(--hairline);
  }
  .filmstrip::before,
  .filmstrip::after{
    content:'';
    position:absolute;
    inset:0;
    background-image: radial-gradient(circle, var(--ink) 4px, transparent 4.5px);
    background-size: 30px 22px;
    background-position: 5px center;
  }

  main{
    max-width:640px;
    margin:0 auto;
    padding:64px 24px 96px;
  }

  .eyebrow-free-standfirst{
    text-align:center;
    color:var(--slate);
    font-size:16px;
    line-height:1.6;
    max-width:440px;
    margin:16px auto 0;
  }

  h1{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    text-align:center;
    font-size:clamp(34px, 6vw, 52px);
    line-height:1.1;
    margin:0;
    color:#F6F3EC;
  }

  /* --- input panel --- */
  .panel{
    margin-top:40px;
    background:var(--ink-raised);
    border:1px solid var(--hairline);
    border-radius:10px;
    padding:20px;
  }

  textarea{
    width:100%;
    resize:vertical;
    min-height:88px;
    background:transparent;
    border:none;
    outline:none;
    color:#EDEBE4;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:16px;
    line-height:1.5;
  }
  textarea::placeholder{ color:#5C6274; }

  .panel-divider{
    height:1px;
    background:var(--hairline);
    margin:16px 0;
  }

  button#searchBtn{
    width:100%;
    background:var(--gold);
    color:#1B1400;
    border:none;
    border-radius:8px;
    padding:14px 18px;
    font-size:16px;
    font-weight:600;
    font-family:'IBM Plex Sans', sans-serif;
    cursor:pointer;
    transition: box-shadow 160ms ease, transform 160ms ease;
  }
  button#searchBtn:hover{
    box-shadow: 0 0 0 6px rgba(232,163,61,0.15);
  }
  button#searchBtn:active{
    transform: scale(0.99);
  }
  button#searchBtn:focus-visible,
  textarea:focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
  button#searchBtn:disabled{
    opacity:0.6;
    cursor:default;
  }

  /* --- loading --- */
  #loading{
    display:none;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-top:32px;
    color:var(--slate);
    font-size:15px;
  }
  #loading.active{ display:flex; }

  .spinner{
    width:18px; height:18px;
    border-radius:50%;
    border:2px solid var(--hairline);
    border-top-color:var(--gold);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){
    .spinner{ animation:none; }
  }

  /* --- error state: a torn ticket, not an apology --- */
  #errorDisplay{
    display:none;
    margin-top:32px;
    background:var(--paper);
    color:#3A2E20;
    border-radius:8px;
    padding:20px;
  }
  #errorDisplay.active{ display:block; }
  #errorDisplay h3{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:20px;
    margin:0 0 8px;
  }
  #errorDisplay pre{
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size:13px;
    white-space:pre-wrap;
    word-break:break-word;
    color:#5A4A38;
    margin:0;
  }

  /* --- results: an editorial list, not a card grid --- */
  #resultsList{
    margin-top:48px;
  }
  .result-row{
    display:flex;
    gap:20px;
    padding:24px 0;
    border-top:1px solid var(--hairline);
  }
  .result-row:first-child{ border-top:1px solid var(--hairline); }

  .frame-number{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    color:var(--velvet);
    font-weight:600;
    padding-top:4px;
    min-width:24px;
  }

  .result-body{ flex:1; min-width:0; }

  .result-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:16px;
  }

  .result-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:22px;
    color:#F6F3EC;
    margin:0;
  }

  .result-score{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:20px;
    color:var(--gold);
    white-space:nowrap;
  }

  .result-genres{
    color:var(--slate);
    font-size:14px;
    margin:4px 0 10px;
  }

  .result-overview{
    color:#C8C6BE;
    font-size:15px;
    line-height:1.6;
    margin:0;
  }

  @media (max-width:480px){
    main{ padding:48px 18px 72px; }
    .result-title{ font-size:19px; }
  }
</style>
</head>
<body>

  <div class="filmstrip"></div>

  <main>
    <h1>What's tonight's mood?</h1>
    <p class="eyebrow-free-standfirst">Describe how you want to feel. A small model running in your browser matches it to a film.</p>

    <div class="panel">
      <textarea id="moodInput" placeholder="A rainy cyberpunk detective story that feels lonely but action-packed..."></textarea>
      <div class="panel-divider"></div>
      <button id="searchBtn">Find my film</button>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <span>Scanning for your film...</span>
    </div>

    <div id="errorDisplay">
      <h3>Screening interrupted</h3>
      <pre id="errorText"></pre>
    </div>

    <div id="resultsList"></div>
  </main>

  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0/dist/transformers.min.js';

    env.allowLocalModels = false;

    let extractor = null;
    const btn = document.getElementById('searchBtn');
    const loading = document.getElementById('loading');
    const resultsDiv = document.getElementById('resultsList');
    const errorDisplay = document.getElementById('errorDisplay');
    const errorText = document.getElementById('errorText');
    const loadingLabel = loading.querySelector('span');

    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, c => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
      }[c]));
    }

    btn.addEventListener('click', async () => {
      const mood = document.getElementById('moodInput').value;
      if (!mood.trim()) return;

      btn.disabled = true;
      loading.classList.add('active');
      errorDisplay.classList.remove('active');
      resultsDiv.innerHTML = '';

      try {
        if (!extractor) {
          loadingLabel.textContent = 'Loading the model, first time only...';
          extractor = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');
        }
        loadingLabel.textContent = 'Scanning for your film...';

        const output = await extractor(mood, { pooling: 'mean', normalize: true });
        const vectorArray = Array.from(output.data);

        const response = await fetch('/api/recommend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ vector: vectorArray, num_results: 5 })
        });

        if (!response.ok) {
          let serverErrorMessage = response.statusText;
          try {
            const errData = await response.json();
            serverErrorMessage = errData.detail || JSON.stringify(errData);
          } catch (e) { /* keep statusText */ }
          throw new Error(`Backend error (HTTP ${response.status}):\n${serverErrorMessage}`);
        }

        const data = await response.json();

        data.results.forEach((movie, i) => {
          resultsDiv.innerHTML += `
            <div class="result-row">
              <div class="frame-number">${String(i + 1).padStart(2, '0')}</div>
              <div class="result-body">
                <div class="result-top">
                  <h2 class="result-title">${escapeHtml(movie.title)}</h2>
                  <span class="result-score">${movie.score}%</span>
                </div>
                <p class="result-genres">${escapeHtml(movie.genres)}</p>
                <p class="result-overview">${escapeHtml(movie.overview)}</p>
              </div>
            </div>
          `;
        });
      } catch (err) {
        console.error(err);
        errorText.textContent = `${err.message}\n\nCheck your Vercel deployment logs for the full trace.`;
        errorDisplay.classList.add('active');
      } finally {
        btn.disabled = false;
        loading.classList.remove('active');
      }
    });
  </script>
</body>
</html>
