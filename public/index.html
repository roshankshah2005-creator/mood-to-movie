<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibe Matcher — find a film that fits the feeling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12141C;
    --ink-raised:#191C26;
    --gold:#E8A33D;
    --velvet:#C1443B;
    --paper:#F1ECE0;
    --slate:#8B93A8;
    --hairline:#2A2D3A;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--ink);
    color:#EDEBE4;
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }

  /* --- film strip header --- */
  .filmstrip{
    height:22px;
    width:100%;
    background:
      repeating-linear-gradient(
        90deg,
        transparent 0 10px,
        var(--ink-raised) 10px 30px
      );
    position:relative;
    border-bottom:1px solid var(--hairline);
  }
  .filmstrip::before,
  .filmstrip::after{
    content:'';
    position:absolute;
    inset:0;
    background-image: radial-gradient(circle, var(--ink) 4px, transparent 4.5px);
    background-size: 30px 22px;
    background-position: 5px center;
  }

  main{
    max-width:640px;
    margin:0 auto;
    padding:64px 24px 96px;
  }

  .eyebrow-free-standfirst{
    text-align:center;
    color:var(--slate);
    font-size:16px;
    line-height:1.6;
    max-width:440px;
    margin:16px auto 0;
  }

  h1{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    text-align:center;
    font-size:clamp(34px, 6vw, 52px);
    line-height:1.1;
    margin:0;
    color:#F6F3EC;
  }

  /* --- input panel --- */
  .panel{
    margin-top:40px;
    background:var(--ink-raised);
    border:1px solid var(--hairline);
    border-radius:10px;
    padding:20px;
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 13px;
  }

  .surprise-btn {
    background: transparent;
    border: none;
    color: var(--gold);
    cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    padding: 0;
  }
  .surprise-btn:hover { text-decoration: underline; }

  textarea{
    width:100%;
    resize:vertical;
    min-height:88px;
    background:transparent;
    border:none;
    outline:none;
    color:#EDEBE4;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:16px;
    line-height:1.5;
  }
  textarea::placeholder{ color:#5C6274; }

  .panel-divider{
    height:1px;
    background:var(--hairline);
    margin:16px 0;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    font-size: 14px;
    color: var(--slate);
  }

  .controls input[type="range"] {
    accent-color: var(--gold);
    cursor: pointer;
  }

  button#searchBtn{
    width:100%;
    background:var(--gold);
    color:#1B1400;
    border:none;
    border-radius:8px;
    padding:14px 18px;
    font-size:16px;
    font-weight:600;
    font-family:'IBM Plex Sans', sans-serif;
    cursor:pointer;
    transition: box-shadow 160ms ease, transform 160ms ease;
  }
  button#searchBtn:hover{ box-shadow: 0 0 0 6px rgba(232,163,61,0.15); }
  button#searchBtn:active{ transform: scale(0.99); }
  button#searchBtn:focus-visible,
  textarea:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
  button#searchBtn:disabled{ opacity:0.6; cursor:default; }

  /* --- history chips (UPDATED) --- */
  .history-container {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .history-chip {
    display: inline-flex;
    align-items: center;
    background: transparent;
    border: 1px solid var(--hairline);
    border-radius: 20px;
    font-size: 12px;
    transition: all 0.2s;
    max-width: 220px;
  }
  .history-chip:hover {
    border-color: var(--slate);
  }
  .history-chip-text {
    color: var(--slate);
    padding: 4px 4px 4px 10px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.2s;
  }
  .history-chip-text:hover {
    color: #EDEBE4;
  }
  .history-chip-delete {
    color: var(--slate);
    padding: 4px 10px 4px 4px;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    transition: color 0.2s;
  }
  .history-chip-delete:hover {
    color: var(--velvet);
  }

  /* --- loading --- */
  #loading{
    display:none;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-top:32px;
    color:var(--slate);
    font-size:15px;
  }
  #loading.active{ display:flex; }

  .spinner{
    width:18px; height:18px;
    border-radius:50%;
    border:2px solid var(--hairline);
    border-top-color:var(--gold);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* --- error state --- */
  #errorDisplay{
    display:none;
    margin-top:32px;
    background:var(--paper);
    color:#3A2E20;
    border-radius:8px;
    padding:20px;
  }
  #errorDisplay.active{ display:block; }
  #errorDisplay h3{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:20px;
    margin:0 0 8px;
  }
  #errorDisplay pre{
    font-family: ui-monospace, Consolas, monospace;
    font-size:13px;
    white-space:pre-wrap;
    word-break:break-word;
    color:#5A4A38;
    margin:0;
  }

  /* --- results --- */
  .section-title {
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style:italic;
    font-size: 24px;
    color: var(--slate);
    margin: 48px 0 16px;
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 8px;
    display: none;
  }
  .section-title.active { display: block; }

  .result-row{
    display:flex;
    gap:20px;
    padding:24px 0;
    border-top:1px solid var(--hairline);
  }
  #resultsList .result-row:first-child{ border-top: none; padding-top: 8px;}

  .frame-number{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    color:var(--velvet);
    font-weight:600;
    padding-top:4px;
    min-width:24px;
  }

  .result-body{ flex:1; min-width:0; }

  .result-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:16px;
  }

  .result-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:22px;
    color:#F6F3EC;
    margin:0;
  }

  .result-score{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:20px;
    color:var(--gold);
    white-space:nowrap;
  }

  .result-genres{
    color:var(--slate);
    font-size:14px;
    margin:4px 0 10px;
  }

  .result-overview{
    color:#C8C6BE;
    font-size:15px;
    line-height:1.6;
    margin:0 0 12px;
  }

  .result-actions {
    display: flex;
    gap: 16px;
  }

  .action-btn {
    background: transparent;
    border: none;
    color: var(--gold);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .action-btn:hover { text-decoration: underline; }
  .action-btn.saved { color: var(--slate); pointer-events: none; }

  @media (max-width:480px){
    main{ padding:48px 18px 72px; }
    .result-title{ font-size:19px; }
  }
</style>
</head>
<body>

  <div class="filmstrip"></div>

  <main>
    <h1>What's tonight's mood?</h1>
    <p class="eyebrow-free-standfirst">Describe how you want to feel. A small model running in your browser matches it to a film.</p>

    <div class="panel">
      <div class="panel-header">
        <span style="color: var(--slate);">Your Vibe</span>
        <button id="surpriseBtn" class="surprise-btn">✨ Surprise me</button>
      </div>
      <textarea id="moodInput" placeholder="A rainy cyberpunk detective story that feels lonely but action-packed..."></textarea>
      <div class="panel-divider"></div>
      
      <div class="controls">
        <label for="numResultsSlider">Results to show: <span id="numResultsLabel" style="color:#EDEBE4; font-weight:600;">5</span></label>
        <input type="range" id="numResultsSlider" min="1" max="10" value="5">
      </div>

      <button id="searchBtn">Find my film</button>
    </div>

    <!-- History Chips -->
    <div id="historyContainer" class="history-container"></div>

    <div id="loading">
      <div class="spinner"></div>
      <span>Scanning for your film...</span>
    </div>

    <div id="errorDisplay">
      <h3>Screening interrupted</h3>
      <pre id="errorText"></pre>
    </div>

    <div id="resultsList"></div>

    <!-- Favorites Section -->
    <h3 id="savedTitle" class="section-title">Saved Films</h3>
    <div id="savedList"></div>
  </main>

  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0/dist/transformers.min.js';

    env.allowLocalModels = false;

    // --- DOM Elements ---
    let extractor = null;
    const btn = document.getElementById('searchBtn');
    const moodInput = document.getElementById('moodInput');
    const loading = document.getElementById('loading');
    const resultsDiv = document.getElementById('resultsList');
    const errorDisplay = document.getElementById('errorDisplay');
    const errorText = document.getElementById('errorText');
    const loadingLabel = loading.querySelector('span');
    
    // New Feature Elements
    const surpriseBtn = document.getElementById('surpriseBtn');
    const numResultsSlider = document.getElementById('numResultsSlider');
    const numResultsLabel = document.getElementById('numResultsLabel');
    const historyContainer = document.getElementById('historyContainer');
    const savedList = document.getElementById('savedList');
    const savedTitle = document.getElementById('savedTitle');

    // --- Global State ---
    let currentResults = [];
    let savedMovies = JSON.parse(localStorage.getItem('vibeSavedMovies')) || [];
    let searchHistory = JSON.parse(localStorage.getItem('vibeSearchHistory')) || [];

    // --- Utility: Escape HTML ---
    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, c => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
      }[c]));
    }

    // --- Feature: Surprise Me ---
    const surpriseMoods = [
      "A quiet, visually stunning sci-fi about isolation",
      "A fast-paced heist movie with a jazz soundtrack",
      "A nostalgic coming-of-age story set in the 1980s",
      "A dark, psychological thriller that messes with your mind",
      "A sweeping fantasy epic with massive battles and lore",
      "A cozy romance set in a small rainy town"
    ];
    
    surpriseBtn.addEventListener('click', () => {
      const randomMood = surpriseMoods[Math.floor(Math.random() * surpriseMoods.length)];
      moodInput.value = randomMood;
    });

    // --- Feature: Slider Update ---
    numResultsSlider.addEventListener('input', (e) => {
      numResultsLabel.textContent = e.target.value;
    });

    // --- Feature: Search History (UPDATED FOR DELETION) ---
    function renderHistory() {
      historyContainer.innerHTML = '';
      searchHistory.forEach((mood, index) => {
        const chip = document.createElement('div');
        chip.className = 'history-chip';
        
        // Text part (searches)
        const textSpan = document.createElement('span');
        textSpan.className = 'history-chip-text';
        textSpan.textContent = mood;
        textSpan.title = mood;
        textSpan.onclick = () => {
          moodInput.value = mood;
          btn.click();
        };

        // Delete part
        const deleteSpan = document.createElement('span');
        deleteSpan.className = 'history-chip-delete';
        deleteSpan.innerHTML = '&times;';
        deleteSpan.title = 'Remove from history';
        deleteSpan.onclick = (e) => {
          e.stopPropagation(); // Prevents the click from bubbling up
          searchHistory.splice(index, 1);
          localStorage.setItem('vibeSearchHistory', JSON.stringify(searchHistory));
          renderHistory();
        };

        chip.appendChild(textSpan);
        chip.appendChild(deleteSpan);
        historyContainer.appendChild(chip);
      });
    }

    function addToHistory(mood) {
      if (!searchHistory.includes(mood)) {
        searchHistory.unshift(mood);
        if (searchHistory.length > 5) searchHistory.pop();
        localStorage.setItem('vibeSearchHistory', JSON.stringify(searchHistory));
        renderHistory();
      }
    }

    // --- Feature: Saved Favorites ---
    function renderSaved() {
      savedList.innerHTML = '';
      if (savedMovies.length > 0) {
        savedTitle.classList.add('active');
        savedMovies.forEach((movie, i) => {
          savedList.innerHTML += `
            <div class="result-row">
              <div class="frame-number">★</div>
              <div class="result-body">
                <div class="result-top">
                  <h2 class="result-title">${escapeHtml(movie.title)}</h2>
                </div>
                <p class="result-genres">${escapeHtml(movie.genres)}</p>
                <p class="result-overview">${escapeHtml(movie.overview)}</p>
                <div class="result-actions">
                  <button class="action-btn remove-btn" data-id="${i}">🗑 Remove</button>
                </div>
              </div>
            </div>
          `;
        });
      } else {
        savedTitle.classList.remove('active');
      }
    }

    // Handle Clicks for dynamically generated buttons (Save, Copy, Remove)
    document.addEventListener('click', async (e) => {
      // COPY BUTTON
      if (e.target.classList.contains('copy-btn')) {
        const idx = e.target.getAttribute('data-index');
        const movie = currentResults[idx];
        const textToCopy = `Check out this film: ${movie.title} (${movie.genres})\n\n${movie.overview}`;
        
        try {
          await navigator.clipboard.writeText(textToCopy);
          e.target.textContent = "✓ Copied!";
          setTimeout(() => e.target.textContent = "🔗 Copy to share", 2000);
        } catch (err) {
          console.error('Failed to copy: ', err);
        }
      }

      // SAVE BUTTON
      if (e.target.classList.contains('save-btn')) {
        const idx = e.target.getAttribute('data-index');
        const movie = currentResults[idx];
        
        // Prevent duplicates
        if (!savedMovies.some(m => m.title === movie.title)) {
          savedMovies.unshift(movie);
          localStorage.setItem('vibeSavedMovies', JSON.stringify(savedMovies));
          renderSaved();
        }
        
        e.target.textContent = "✓ Saved";
        e.target.classList.add('saved');
      }

      // REMOVE SAVED BUTTON
      if (e.target.classList.contains('remove-btn')) {
        const idx = e.target.getAttribute('data-id');
        savedMovies.splice(idx, 1);
        localStorage.setItem('vibeSavedMovies', JSON.stringify(savedMovies));
        renderSaved();
      }
    });

    // Initialize UI on load
    renderHistory();
    renderSaved();

    // --- Main Search Execution ---
    btn.addEventListener('click', async () => {
      const mood = moodInput.value;
      const numResults = parseInt(numResultsSlider.value);
      
      if (!mood.trim()) return;

      btn.disabled = true;
      loading.classList.add('active');
      errorDisplay.classList.remove('active');
      resultsDiv.innerHTML = '';
      currentResults = []; 

      addToHistory(mood.trim());

      try {
        if (!extractor) {
          loadingLabel.textContent = 'Loading the model, first time only...';
          extractor = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');
        }
        loadingLabel.textContent = 'Scanning for your film...';

        const output = await extractor(mood, { pooling: 'mean', normalize: true });
        const vectorArray = Array.from(output.data);

        const response = await fetch('/api/recommend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ vector: vectorArray, num_results: numResults })
        });

        if (!response.ok) {
          let serverErrorMessage = response.statusText;
          try {
            const errData = await response.json();
            serverErrorMessage = errData.detail || JSON.stringify(errData);
          } catch (e) {}
          throw new Error(`Backend error (HTTP ${response.status}):\n${serverErrorMessage}`);
        }

        const data = await response.json();
        currentResults = data.results; 

        data.results.forEach((movie, i) => {
          const isSaved = savedMovies.some(m => m.title === movie.title);
          
          resultsDiv.innerHTML += `
            <div class="result-row">
              <div class="frame-number">${String(i + 1).padStart(2, '0')}</div>
              <div class="result-body">
                <div class="result-top">
                  <h2 class="result-title">${escapeHtml(movie.title)}</h2>
                  <span class="result-score">${movie.score}%</span>
                </div>
                <p class="result-genres">${escapeHtml(movie.genres)}</p>
                <p class="result-overview">${escapeHtml(movie.overview)}</p>
                <div class="result-actions">
                  <button class="action-btn save-btn ${isSaved ? 'saved' : ''}" data-index="${i}">
                    ${isSaved ? '✓ Saved' : '❤️ Save film'}
                  </button>
                  <button class="action-btn copy-btn" data-index="${i}">🔗 Copy to share</button>
                </div>
              </div>
            </div>
          `;
        });
      } catch (err) {
        console.error(err);
        errorText.textContent = `${err.message}\n\nCheck your Vercel deployment logs for the full trace.`;
        errorDisplay.classList.add('active');
      } finally {
        btn.disabled = false;
        loading.classList.remove('active');
      }
    });
  </script>
</body>
</html>
